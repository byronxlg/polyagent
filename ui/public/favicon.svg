<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#1a1a2e" stroke="#4f46e5" stroke-width="1.5"/>

  <!-- Connection lines -->
  <line x1="10" y1="10" x2="22" y2="10" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="10" y1="10" x2="16" y2="22" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="10" x2="16" y2="22" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Agent nodes -->
  <circle cx="10" cy="10" r="3.5" fill="#4f46e5"/>
  <circle cx="22" cy="10" r="3.5" fill="#4f46e5"/>
  <circle cx="16" cy="22" r="3.5" fill="#4f46e5"/>

  <!-- Inner highlights on nodes -->
  <circle cx="10" cy="10" r="1.5" fill="#a5b4fc"/>
  <circle cx="22" cy="10" r="1.5" fill="#a5b4fc"/>
  <circle cx="16" cy="22" r="1.5" fill="#a5b4fc"/>
</svg>
