name: API

on:
  push:
    branches: [main]
    paths:
      - 'polyagent/**'
      - '.github/workflows/api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'polyagent/**'
      - '.github/workflows/api.yml'

defaults:
  run:
    working-directory: polyagent

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ruff check
        uses: astral-sh/ruff-action@v2
        with:
          src: "./polyagent/src"

      - name: Run ruff format check
        uses: astral-sh/ruff-action@v2
        with:
          src: "./polyagent/src"
          args: "format --check"

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_civilisation
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests
        env:
          DATABASE_URL: postgresql://agent:agent@localhost:5432/agent_civilisation
        run: uv run pytest --tb=short
